<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No zooming, like a native app: maximum-scale=1 also stops iOS zooming in when a text
         field is focused (it does that for fields under 16px). Pinch is blocked in src/lib/noZoom.ts.
         viewport-fit=cover lets the app reach under the iPhone's status bar; pages keep clear of
         it with --safe-top (index.css), and the maps run up under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hobbs</title>
    <script>
      // Apply the saved theme before the first paint (see src/lib/theme.ts).
      try {
        const theme = localStorage.getItem('hobbs-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
